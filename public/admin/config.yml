# Decap CMS 配置
# 后端：GitHub（仓库 Marfurrrr/muse-blog，分支 main）
# 登录：通过本站自建的 OAuth 中转服务 decap-oauth（systemd 服务，端口 3000，
# nginx 把 /oauth/ 代理到它）。Client ID 是公开的；Client Secret 只存在
# 服务器文件 /opt/decap-oauth/.env 里，绝不写进仓库。
backend:
  name: github
  repo: Marfurrrr/muse-blog
  branch: main
  base_url: https://muse.marfurrrr.home64.de
  auth_endpoint: oauth/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "文章"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "正文", name: "body", widget: "markdown" }
